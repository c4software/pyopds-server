<!-- One clipping (view model {text, note, caption} named clip), included server-side in the x-for templates
     of the reading and clippings pages (include_partials, controllers/webui.py) -->
<figure class="card p-3 text-sm">
    <blockquote class="clip-text" x-text="clip.text"></blockquote>
    <p x-show="clip.note" class="mt-2 text-xs italic text-slate-600 dark:text-slate-300" x-text="clip.note"></p>
    <figcaption class="mt-2 text-xs text-slate-500 dark:text-slate-400" x-text="clip.caption"></figcaption>
</figure>
