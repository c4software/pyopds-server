<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lecture et statistiques</title>
    <!--#include page-head -->
    <link rel="stylesheet" href="/static/reading/reading.css"/>
    <script src="/static/reading/reading.js" defer></script>
    <!--#include alpine -->
</head>
<!-- Templates of the `reading` component (static/reading/reading.js). Icons: <i data-lucide> placeholders, replaced by
     lucide.createIcons() after each render; never put an Alpine directive on them except a static :data-lucide. -->
<body x-data="reading" class="bg-slate-50 font-sans dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen">
    <!--#include header title="Lecture" -->

    <main x-show="ready" x-cloak class="flex p-4 sm:p-6 max-w-6xl mx-auto flex-col gap-8">
        <!--#include load-status -->

        <div x-show="kpis.length" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <template x-for="kpi in kpis" :key="kpi.label">
                <div class="card p-3">
                    <div class="flex items-center gap-1.5 kpi-label"><i :data-lucide="kpi.icon" class="w-3.5 h-3.5"></i><span x-text="kpi.label"></span></div>
                    <div class="kpi-value mt-1" x-text="kpi.value"></div>
                </div>
            </template>
        </div>

        <section x-show="showActivity">
            <h2 class="section-title"><i data-lucide="calendar-days" class="w-4 h-4"></i>Activité de lecture</h2>
            <div class="card p-4">
                <div id="heatmap" x-ref="heatmap" class="heatmap-scroll">
                    <div class="heatmap-months">
                        <template x-for="month in heatmap.months" :key="month.key"><span x-text="month.label"></span></template>
                    </div>
                    <div class="heatmap">
                        <template x-for="cell in heatmap.cells" :key="cell.key">
                            <span :class="cell.cls" @mouseenter="cell.tip && showTip($event, cell.tip)" @mouseleave="hideTip()"></span>
                        </template>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-1 mt-2 text-xs text-slate-500 dark:text-slate-400">
                    <span>Moins</span>
                    <span class="heat-cell heat-0"></span><span class="heat-cell heat-1"></span><span class="heat-cell heat-2"></span><span class="heat-cell heat-3"></span><span class="heat-cell heat-4"></span>
                    <span>Plus</span>
                </div>
            </div>
            <div class="grid gap-3 md:grid-cols-3 mt-3">
                <div class="card p-4 md:col-span-3">
                    <h3 class="card-title" x-text="daily.title"></h3>
                    <div class="bars">
                        <template x-for="bar in daily.bars" :key="bar.key">
                            <div class="bar-slot" @mouseenter="showTip($event, bar.tip)" @mouseleave="hideTip()"><div class="bar" :style="'height:' + bar.height + '%'"></div></div>
                        </template>
                    </div>
                    <div class="bars-axis"><span x-text="daily.start"></span><span x-text="daily.max"></span><span>Aujourd'hui</span></div>
                </div>
                <div x-show="tod.length" class="card p-4">
                    <h3 class="card-title">Moment de la journée</h3>
                    <template x-for="row in tod" :key="row.label">
                        <div class="hbar"><span x-text="row.label"></span><div class="progress-track"><div class="progress-fill" :style="'width:' + row.width + '%'"></div></div><span class="value" x-text="row.value"></span></div>
                    </template>
                </div>
                <div x-show="dow.length" class="card p-4">
                    <h3 class="card-title">Jour de la semaine</h3>
                    <template x-for="row in dow" :key="row.label">
                        <div class="hbar"><span x-text="row.label"></span><div class="progress-track"><div class="progress-fill" :style="'width:' + row.width + '%'"></div></div><span class="value" x-text="row.value"></span></div>
                    </template>
                </div>
                <div x-show="devices.length" class="card p-4">
                    <h3 class="card-title">Appareils</h3>
                    <ul class="space-y-2 text-sm">
                        <template x-for="device in devices" :key="device.key">
                            <li class="flex items-start gap-2">
                                <i data-lucide="tablet" class="w-4 h-4 mt-0.5 text-slate-400"></i>
                                <div class="min-w-0">
                                    <div class="truncate"><span x-text="device.name"></span><template x-if="device.stats"><span> <span class="badge">stats</span></span></template></div>
                                    <div class="text-xs text-slate-500 dark:text-slate-400" x-text="device.detail"></div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </section>

        <!-- En cours, Terminés, Abandonnés: same card, progress details for the books in progress only -->
        <template x-for="section in sections" :key="section.id">
            <section x-show="section.books.length">
                <h2 class="section-title"><i :data-lucide="section.icon" class="w-4 h-4"></i><span x-text="section.title"></span> <span class="count" x-text="section.count"></span></h2>
                <div :class="section.grid">
                    <template x-for="book in section.books" :key="book.key">
                        <article class="card p-3 flex gap-3">
                            <!--#include book-thumb item="book" error="coverError(book)" -->
                            <div class="min-w-0 flex-1">
                                <div class="font-medium text-sm leading-snug" x-text="book.title"></div>
                                <div x-show="book.author" class="text-xs text-slate-500 dark:text-slate-400 truncate" x-text="book.author"></div>
                                <template x-if="book.reading">
                                    <div>
                                        <div class="flex items-center gap-2 mt-2">
                                            <div class="progress-track flex-1"><div class="progress-fill" :style="'width:' + book.progress + '%'"></div></div>
                                            <span class="text-xs font-medium" x-text="book.percent"></span>
                                        </div>
                                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1"><span x-text="book.meta"></span><template x-if="book.paused"><span> <span class="badge">en pause</span></span></template></div>
                                        <div x-show="book.started" class="text-xs text-slate-500 dark:text-slate-400" x-text="book.started"></div>
                                        <ul x-show="book.devices.length" class="mt-2 space-y-1 text-xs text-slate-500 dark:text-slate-400">
                                            <template x-for="row in book.devices" :key="row.key">
                                                <li class="grid grid-cols-[1fr_auto] gap-x-2 items-center">
                                                    <span class="truncate" x-text="row.label"></span><span x-text="row.percent"></span>
                                                    <div class="progress-track col-span-2" style="height:3px"><div class="progress-fill" :style="'width:' + row.progress + '%'"></div></div>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                                <div x-show="!book.reading" class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-text="book.detail"></div>
                                <!-- Books the hashes did not match: associate them by hand with a library EPUB -->
                                <template x-if="book.linkable">
                                    <div class="flex flex-wrap gap-3 mt-2">
                                        <button type="button" @click="openLink(book)" class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-200"><i data-lucide="link" class="w-3.5 h-3.5"></i>Associer à un livre</button>
                                    </div>
                                </template>
                                <template x-if="!book.linkable">
                                    <div class="flex flex-wrap gap-3 mt-2">
                                        <a class="inline-flex items-center gap-1 text-xs font-medium text-teal-700 hover:text-teal-900 dark:text-teal-300 dark:hover:text-teal-200" :href="book.read"><i data-lucide="book-open" class="w-3.5 h-3.5"></i><span x-text="book.reading ? 'Continuer la lecture' : 'Lire'"></span></a>
                                        <a class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-200" :href="book.catalog"><i data-lucide="library" class="w-3.5 h-3.5"></i>Voir dans le catalogue</a>
                                        <a class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-200" :href="book.download"><i data-lucide="download" class="w-3.5 h-3.5"></i>Télécharger</a>
                                        <template x-if="book.unlink">
                                            <button type="button" @click="unlink(book)" class="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-200"><i data-lucide="unlink" class="w-3.5 h-3.5"></i>Dissocier</button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </article>
                    </template>
                </div>
            </section>
        </template>

        <section x-show="clippings.length">
            <h2 class="section-title"><i data-lucide="highlighter" class="w-4 h-4"></i>Derniers surlignages <span class="count" x-text="clippingsCount"></span>
                <a href="/clippings" class="ml-auto text-xs font-normal text-teal-700 hover:underline dark:text-teal-300">Tous les surlignages</a></h2>
            <div class="grid gap-3 md:grid-cols-2">
                <template x-for="clip in clippings" :key="clip.key">
                    <!--#include clipping -->
                </template>
            </div>
        </section>

        <p x-show="empty" class="text-sm text-slate-500 dark:text-slate-400">Aucune progression synchronisée pour ce compte pour l'instant.</p>
    </main>

    <dialog id="link-dialog" x-ref="linkDialog" class="link-dialog">
        <form class="flex flex-col gap-3" method="dialog" @submit.prevent="search()">
            <div class="flex items-center justify-between gap-2">
                <h2 class="text-base font-medium">Associer à un livre du catalogue</h2>
                <button type="button" @click="$refs.linkDialog.close()" class="text-slate-500 hover:text-slate-900 dark:hover:text-slate-200" title="Fermer"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <p id="link-document" class="text-xs text-slate-500 dark:text-slate-400 break-all" x-text="link.label"></p>
            <div class="flex gap-2">
                <input id="link-query" x-ref="linkQuery" x-model="link.query" type="search" placeholder="Titre, auteur…" class="flex-1 rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-1.5 text-sm" autocomplete="off"/>
                <button type="submit" class="rounded-md bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 text-sm">Chercher</button>
            </div>
            <p id="link-status" class="text-xs text-slate-500 dark:text-slate-400" x-text="link.status"></p>
            <ul id="link-results" class="flex flex-col gap-1 max-h-80 overflow-y-auto">
                <template x-for="result in link.results" :key="result.path">
                    <li>
                        <button type="button" class="link-result" @click="associate(result.path)">
                            <span class="block text-sm font-medium" x-text="result.title"></span>
                            <span class="block text-xs text-slate-500 dark:text-slate-400" x-text="result.detail"></span>
                        </button>
                    </li>
                </template>
            </ul>
        </form>
    </dialog>

    <div id="tooltip" x-ref="tooltip" class="chart-tooltip" role="tooltip" hidden :hidden="!tooltip.show" x-text="tooltip.text"
         :style="'left:' + tooltip.left + 'px;top:' + tooltip.top + 'px'"></div>
</body>
</html>
