<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Lecture</title>
    <!--#include app -->
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/tailwind.css"/>
    <script src="/static/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/reader/reader.css"/>
    <!-- Components registered on alpine:init, so before Alpine (deferred scripts run in order);
         foliate-js (static/foliate/) is loaded by static/reader/book.js with import() -->
    <script src="/static/account.js" defer></script>
    <script src="/static/page-kit.js" defer></script>
    <script src="/static/nav.js" defer></script>
    <script src="/static/reader/positions.js" defer></script>
    <script src="/static/reader/book.js" defer></script>
    <script src="/static/reader/settings.js" defer></script>
    <script src="/static/reader/sync.js" defer></script>
    <script src="/static/reader/stats.js" defer></script>
    <script src="/static/reader/wake.js" defer></script>
    <script src="/static/reader/highlights.js" defer></script>
    <script src="/static/reader/narration.js" defer></script>
    <script src="/static/reader/audiobook.js" defer></script>
    <script src="/static/reader/reader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" defer></script>
</head>
<!-- Templates of the `reader` component (static/reader/reader.js). Icons: <i data-lucide> placeholders, replaced by
     lucide.createIcons() after each render; never put an Alpine directive on them except a static :data-lucide. -->
<body x-data="reader" class="reader-page font-sans">
    <!-- The book (foliate-view), full screen; the bars float above it -->
    <div x-ref="book" class="reader-book"></div>

    <!-- Page arrows of the computers (touch screens: taps on the sides and swipes) -->
    <button type="button" x-show="!loading &amp;&amp; !error &amp;&amp; settings.flow === 'paginated'" x-cloak @click="prev()" class="reader-arrow left-1" title="Page précédente" aria-label="Page précédente">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
    </button>
    <button type="button" x-show="!loading &amp;&amp; !error &amp;&amp; settings.flow === 'paginated'" x-cloak @click="next()" class="reader-arrow right-1" title="Page suivante" aria-label="Page suivante">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
    </button>

    <div x-show="loading" class="reader-center text-sm reader-muted">
        <i data-lucide="loader-circle" class="w-6 h-6 animate-spin"></i>
        <span>Ouverture du livre…</span>
    </div>
    <div x-show="error" x-cloak class="reader-center px-6 text-center">
        <i data-lucide="book-x" class="w-8 h-8 reader-muted"></i>
        <p x-text="error"></p>
        <div class="flex gap-4 text-sm">
            <a :href="catalogUrl" class="reader-link">Catalogue</a>
            <a x-show="downloadUrl" :href="downloadUrl" download class="reader-link">Télécharger l’EPUB</a>
        </div>
    </div>

    <!-- Top bar: back, title, then the menu shared by every screen -->
    <header x-show="chrome || loading || error" x-transition.opacity class="reader-bar reader-top">
        <button type="button" @click="back()" class="reader-icon" title="Retour" aria-label="Retour">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <div class="min-w-0 flex-1">
            <div class="truncate text-sm font-medium" x-text="title"></div>
            <div class="truncate text-xs reader-muted hidden sm:block" x-text="author"></div>
        </div>
        <!--#include nav -->
    </header>

    <!-- Bottom bar: chapter, page, position in the book and the reader's buttons (within reach of the thumb) -->
    <footer x-show="chrome &amp;&amp; !loading &amp;&amp; !error" x-cloak x-transition.opacity class="reader-bar reader-bottom">
        <div class="flex items-center gap-3 text-xs reader-muted">
            <span class="truncate flex-1" x-text="progress.chapter"></span>
            <span class="flex-shrink-0" x-text="progress.page"></span>
            <span class="flex-shrink-0 font-medium" x-text="progress.percent"></span>
        </div>
        <div class="flex items-center gap-1 sm:gap-2">
            <button type="button" @click="togglePanel('toc')" class="reader-icon" :aria-pressed="panel === 'toc'" title="Sommaire" aria-label="Sommaire">
                <i data-lucide="list" class="w-5 h-5"></i>
            </button>
            <input type="range" min="0" max="1000" step="1" class="reader-slider flex-1 mx-1" :value="progress.value"
                   @change="seek($event.target.value)" aria-label="Position dans le livre"/>
            <button type="button" x-show="$store.audiobook.available" x-cloak @click="$store.audiobook.toggle()" class="reader-icon" :aria-pressed="$store.audiobook.active"
                    :title="$store.audiobook.running ? 'Mettre la lecture audio en pause' : 'Écouter'" :aria-label="$store.audiobook.running ? 'Mettre la lecture audio en pause' : 'Écouter'">
                <i data-lucide="headphones" class="w-5 h-5"></i>
            </button>
            <button type="button" x-show="signedIn" @click="togglePanel('clips')" class="reader-icon" :aria-pressed="panel === 'clips'" title="Surlignages" aria-label="Surlignages">
                <i data-lucide="highlighter" class="w-5 h-5"></i>
            </button>
            <button type="button" @click="togglePanel('settings')" class="reader-icon" :aria-pressed="panel === 'settings'" title="Affichage" aria-label="Affichage">
                <i data-lucide="type" class="w-5 h-5"></i>
            </button>
            <button type="button" x-show="fullscreenAvailable" @click="toggleFullscreen()" class="reader-icon" :title="fullscreen ? 'Quitter le plein écran' : 'Plein écran'" :aria-label="fullscreen ? 'Quitter le plein écran' : 'Plein écran'">
                <span x-show="!fullscreen"><i data-lucide="maximize" class="w-5 h-5"></i></span>
                <span x-show="fullscreen" x-cloak><i data-lucide="minimize" class="w-5 h-5"></i></span>
            </button>
        </div>
    </footer>

    <!-- Selected text: highlight it (colors) or add a note -->
    <div x-show="selecting" x-cloak x-transition class="reader-toolbar" role="toolbar" aria-label="Sélection">
        <template x-for="name in colorNames" :key="name">
            <button type="button" class="reader-swatch" :style="'background:' + colorOf(name)" @click="highlight(name, false)" :title="'Surligner (' + name + ')'" :aria-label="'Surligner (' + name + ')'"></button>
        </template>
        <button type="button" @click="highlight('yellow', true)" class="reader-chip">
            <i data-lucide="sticky-note" class="w-4 h-4"></i><span>Note</span>
        </button>
        <button type="button" @click="clearSelection()" class="reader-icon" title="Annuler" aria-label="Annuler">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Notices: position taken from another device, errors -->
    <div x-show="notice" x-cloak x-transition.opacity class="reader-notice" role="status">
        <span class="flex-1" x-text="notice &amp;&amp; notice.text"></span>
        <button type="button" x-show="notice &amp;&amp; notice.action" @click="noticeAction()" class="reader-link font-medium flex-shrink-0" x-text="notice &amp;&amp; notice.action"></button>
        <button type="button" @click="notice = null" class="reader-icon flex-shrink-0" aria-label="Fermer">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Side panel (full screen on a phone): table of contents, clippings, display settings -->
    <div x-show="panel" x-cloak class="reader-scrim" @click="closeFromScrim()"></div>
    <aside x-show="panel" x-cloak x-transition.opacity class="reader-panel" :aria-label="panel === 'toc' ? 'Sommaire' : panel === 'clips' ? 'Surlignages' : 'Affichage'">
        <div class="flex items-center gap-2 px-4 py-3 border-b reader-border">
            <h2 class="flex-1 font-medium" x-text="panel === 'toc' ? 'Sommaire' : panel === 'clips' ? 'Surlignages' : 'Affichage'"></h2>
            <button type="button" @click="panel = null" class="reader-icon" title="Fermer" aria-label="Fermer">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto overscroll-contain">
            <template x-if="panel === 'toc'">
                <nav class="py-2" aria-label="Sommaire">
                    <p x-show="!toc.length" class="px-4 py-2 text-sm reader-muted">Ce livre n’a pas de sommaire.</p>
                    <template x-for="item in toc" :key="item.key">
                        <button type="button" @click="goToToc(item.href)" class="reader-row" :aria-current="item.href === tocCurrent ? 'true' : null"
                                :style="'padding-left:' + (1 + item.depth * 1.1) + 'rem'" x-text="item.label"></button>
                    </template>
                </nav>
            </template>
            <template x-if="panel === 'clips'">
                <div class="p-4 flex flex-col gap-3">
                    <p x-show="!clips.length" class="text-sm reader-muted">Sélectionnez un passage du livre pour le surligner ou l’annoter. Les surlignages de vos liseuses apparaissent ici aussi.</p>
                    <template x-for="clip in clips" :key="clip.id">
                        <div class="reader-clip" :style="'border-color:' + clip.color">
                            <button type="button" @click="showClip(clip.id)" class="text-left w-full">
                                <blockquote class="text-sm leading-relaxed line-clamp-4" x-text="clip.text"></blockquote>
                                <p x-show="clip.note" class="mt-1 text-xs italic" x-text="clip.note"></p>
                                <p class="mt-1 text-xs reader-muted" x-text="clip.caption"></p>
                            </button>
                            <button type="button" @click="edit(clip.id)" class="reader-link text-xs mt-1">Modifier</button>
                        </div>
                    </template>
                    <a href="/clippings" class="reader-link text-sm">Tous mes surlignages</a>
                </div>
            </template>
            <template x-if="panel === 'settings'">
                <div class="p-4 flex flex-col gap-5 text-sm">
                    <div class="reader-setting">
                        <span>Taille du texte</span>
                        <div class="reader-stepper">
                            <button type="button" @click="changeSetting('fontSize', -1)" aria-label="Plus petit">A−</button>
                            <span x-text="settings.fontSize + ' %'"></span>
                            <button type="button" @click="changeSetting('fontSize', 1)" aria-label="Plus grand">A+</button>
                        </div>
                    </div>
                    <div class="reader-setting">
                        <span>Interligne</span>
                        <div class="reader-stepper">
                            <button type="button" @click="changeSetting('lineHeight', -1)" aria-label="Plus serré">−</button>
                            <span x-text="settings.lineHeight.toLocaleString('fr-FR')"></span>
                            <button type="button" @click="changeSetting('lineHeight', 1)" aria-label="Plus aéré">+</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <span>Police</span>
                        <div class="reader-segments">
                            <button type="button" @click="changeSetting('font', 'publisher')" :aria-pressed="settings.font === 'publisher'">Du livre</button>
                            <button type="button" @click="changeSetting('font', 'serif')" :aria-pressed="settings.font === 'serif'" class="font-serif">Serif</button>
                            <button type="button" @click="changeSetting('font', 'sans')" :aria-pressed="settings.font === 'sans'">Sans</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <span>Marges</span>
                        <div class="reader-segments">
                            <button type="button" @click="changeSetting('margins', 'narrow')" :aria-pressed="settings.margins === 'narrow'">Étroites</button>
                            <button type="button" @click="changeSetting('margins', 'normal')" :aria-pressed="settings.margins === 'normal'">Normales</button>
                            <button type="button" @click="changeSetting('margins', 'wide')" :aria-pressed="settings.margins === 'wide'">Larges</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <span>Thème</span>
                        <div class="reader-segments">
                            <button type="button" @click="changeSetting('theme', 'auto')" :aria-pressed="settings.theme === 'auto'">Auto</button>
                            <button type="button" @click="changeSetting('theme', 'light')" :aria-pressed="settings.theme === 'light'">Clair</button>
                            <button type="button" @click="changeSetting('theme', 'sepia')" :aria-pressed="settings.theme === 'sepia'">Sépia</button>
                            <button type="button" @click="changeSetting('theme', 'dark')" :aria-pressed="settings.theme === 'dark'">Sombre</button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <span>Mise en page</span>
                        <div class="reader-segments">
                            <button type="button" @click="changeSetting('flow', 'paginated')" :aria-pressed="settings.flow === 'paginated'">Pages</button>
                            <button type="button" @click="changeSetting('flow', 'scrolled')" :aria-pressed="settings.flow === 'scrolled'">Défilement</button>
                        </div>
                    </div>
                    <label class="flex items-center justify-between gap-3">
                        <span>Texte justifié</span>
                        <input type="checkbox" :checked="settings.justify" @change="changeSetting('justify', $event.target.checked)" class="w-4 h-4"/>
                    </label>
                    <p x-show="!signedIn" class="text-xs reader-muted">
                        <a href="/login" class="reader-link">Connectez-vous</a> pour synchroniser la position, les statistiques et les surlignages avec vos liseuses.
                    </p>
                </div>
            </template>
        </div>
    </aside>

    <!-- A clipping: note, color, deletion -->
    <div x-show="editor" x-cloak class="reader-scrim z-40" @click="closeFromScrim()"></div>
    <template x-if="editor">
        <div class="reader-editor" role="dialog" aria-label="Surlignage">
            <blockquote class="text-sm leading-relaxed max-h-40 overflow-y-auto border-l-4 pl-3" :style="'border-color:' + colorOf(editor.color)" x-text="editor.text"></blockquote>
            <p x-show="editor.chapter" class="text-xs reader-muted" x-text="editor.chapter"></p>
            <label class="flex flex-col gap-1 text-sm">
                <span>Note</span>
                <textarea x-ref="note" x-model="editor.note" rows="3" class="reader-input" placeholder="Votre note…"></textarea>
            </label>
            <div class="flex items-center gap-2">
                <template x-for="name in colorNames" :key="name">
                    <button type="button" class="reader-swatch" :style="'background:' + colorOf(name)" :aria-pressed="editor.color === name" @click="editor.color = name" :aria-label="name"></button>
                </template>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" @click="deleteClip()" class="reader-link text-sm text-red-600 dark:text-red-400">Supprimer</button>
                <div class="flex-1"></div>
                <button type="button" @click="editor = null" class="reader-chip">Annuler</button>
                <button type="button" @click="saveEditor()" :disabled="editor.saving" class="reader-chip reader-primary">Enregistrer</button>
            </div>
        </div>
    </template>

    <!--#include reader-audio -->
</body>
</html>
