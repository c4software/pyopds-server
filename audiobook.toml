# Audiobook of the web reader (« Écouter »): the book is read aloud by a text-to-speech
# server speaking the OpenAI API (POST /v1/audio/speech), for instance an llm-proxy or a
# local model server. The text is sent a few paragraphs at a time, just before they are
# played: the whole book is never generated.
#
# Disabled while `url` or `model` is empty. To turn it on, write your settings in another
# file (for example config/audiobook.toml) and point the AUDIOBOOK_CONFIG_PATH environment
# variable to it. That file completes this one, with the same keys (its values win).
# Restart the server to apply changes.
#
# String values may read the environment: "${TTS_API_KEY}" is replaced by that variable.
#
# Example (Qwen3-TTS behind an llm-proxy, classic male narrator):
#
#   url = "http://llm-proxy:8000"
#   model = "silentchuck/qwen3-tts-12hz-1.7b-customvoice"
#   api_key = "${TTS_API_KEY}"
#   voice = "uncle_fu"
#   instructions = "Narrateur professionnel de livre audio : voix masculine grave, chaleureuse et posée. Diction claire et soignée, rythme calme et régulier, intonation naturelle et nuancée qui suit le sens du texte. Courtes pauses aux virgules, pauses plus marquées entre les phrases et les paragraphes. Dialogues interprétés avec sobriété, sans emphase théâtrale."
#
#   [extra]
#   language = "French"

# Base URL of the server (/v1/audio/speech and /v1/audio/voices are appended)
url = ""
# Model of the requests (an llm-proxy names it with its backend: "bigchuck/<model>")
model = ""
# Bearer token sent to the server; empty: no Authorization header
api_key = ""
# Voice and reading tone used for a book the reader did not configure (some models require a voice)
voice = ""
instructions = ""
# Audio format asked for (wav, mp3, opus, aac, flac: what the server supports, played by the browser)
response_format = "wav"
# Request field carrying the reading tone ("instructions" in the OpenAI API); empty: never sent
instructions_field = "instructions"
# Voices offered to the reader; empty: asked to the server (GET /v1/audio/voices?model=…)
voices = []
# Characters sent per request at most: several paragraphs read in one go keep the same tone (the first
# requests are shorter, so that the sound starts soon)
max_chars = 1000
# Seconds allowed for one request
timeout = 120
# Requests sent to the server at the same time, for all the readers
concurrency = 2

# Cloned voices: a voice cloning model (Qwen3-TTS "Base") reads with the voice of a short WAV
# recording (sent with every request, with its transcript); voices made from a description by a
# voice design model with `python -m controllers.tools.voice_design <name> "<description>"`.
# Each [clones.<name>] voice is offered before those of `model`, and can be the default `voice`.
clone_model = ""
design_model = ""
# [clones.narrateur]
# audio = "voix/narrateur.wav"     (relative to the settings file's folder)
# text = "Il était une fois, …"    (transcript of the recording, word for word)

# Extra fields added to every request (options of a given model)
[extra]
# language = "French"   (Qwen3-TTS: otherwise the language is guessed for each request)
