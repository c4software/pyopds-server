    "policier", "policiers", "polar", "polars", "roman policier", "romans policiers",
    "crime", "mystery", "detective", "policier crime mystere", "policier mystere",
    "policier thriller", "policiier mystere crime", "policer", "policiers mysteres",
    "mystery detective", "detective and mystery stories", "murder mysteries",
    "policier serie noire", "romans policiers et espionnage",
]
"Policier historique" = ["policier historique"]
"Thriller" = ["thriller", "thrillers", "techno thriller", "suspense", "suspens", "suspense fiction"]
"Espionnage" = ["espionnage", "espionage"]
