# Genre navigation ("By Genre") built from the EPUB subjects (dc:subject).
#
# To customize it, write your own rules in another file (for example
# config/genres.toml) and point the GENRES_CONFIG_PATH environment variable to it.
# That file completes this one, with the same format: its `min_books` overrides
# the value below, its `ignored` subjects and `[aliases]` are added and win over
# the rules below. Restart the server to apply changes.
#
# Subjects are compared without case, accents or punctuation:
# "Science fiction", "science-fiction" and "SCIENCE FICTION" are the same subject.

# Genres listed in the catalog need at least this many books (hides series names and typos)
min_books = 3

# Subjects carrying no genre information
ignored = [
    "fiction", "roman", "romans", "general", "generalites", "litterature", "literature",
    "ebook", "ebooks", "epub", "livre", "livres", "book", "books", "french", "francais",
    "non classifiable", "divers", "autre", "autres", "unknown", "inconnu", "other",
    "novels", "general fiction", "literature fiction", "literary", "literary collections",
    "litterature generale", "litterature moderne", "livre francais", "romans et nouvelles",
    "contemporain", "contemporains", "prose contemporary", "nouveaux", "collections",
    # Google Books categories that rarely describe the book itself
    "literary criticism", "european", "continental european", "europe", "foreign language study",
    "antiques collectibles", "social science", "man woman relationships", "france", "paris france",
    # Reading states and library bookkeeping
    "lu", "non lu", "non lus", "a lire", "fait maison", "readers", "fr roman",
]

# Displayed genre = subjects merged into it
[aliases]
"Science-fiction" = [
    "sf", "s f", "science fiction", "sciencefiction", "science fiction fantasy", "fr scifi",
    "sf space", "fn anticipation", "fantastique science fiction", "anticipation", "space opera",
    "extraterrestres", "post apocalyptique",
]
